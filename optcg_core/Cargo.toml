[package]
name = "optcg_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "optcg_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
